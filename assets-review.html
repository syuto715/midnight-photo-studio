<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assets Review - 午前零時の写真館</title>
    <style>
      :root {
        --bg: #14100d;
        --paper: #d9c7a5;
        --ink: #e8dcc8;
        --ink-dim: #9a8b74;
        --brass: #c9a227;
        --line: rgba(217, 199, 165, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
        line-height: 1.7;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }

      h1,
      h2 {
        letter-spacing: 0.14em;
        font-weight: 500;
      }

      .asset-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 16px;
      }

      .asset {
        border: 1px solid var(--line);
        padding: 12px;
        background:
          linear-gradient(45deg, rgba(217, 199, 165, 0.08) 25%, transparent 25% 75%, rgba(217, 199, 165, 0.08) 75%),
          linear-gradient(45deg, rgba(217, 199, 165, 0.08) 25%, transparent 25% 75%, rgba(217, 199, 165, 0.08) 75%);
        background-color: #1f1913;
        background-position:
          0 0,
          12px 12px;
        background-size: 24px 24px;
      }

      .asset img {
        width: 100%;
        height: 140px;
        object-fit: contain;
      }

      .asset strong {
        display: block;
        color: var(--paper);
      }

      .asset span {
        color: var(--ink-dim);
        font-size: 0.88rem;
      }

      .stage {
        position: relative;
        width: min(100%, 960px);
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border: 1px solid var(--line);
        background-image: url("public/assets/bg-dining.png");
        background-size: cover;
        background-position: center;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      }

      .stage.photo {
        border: 8px solid var(--paper);
        filter: sepia(0.7) contrast(1.05) brightness(0.9);
        transform: rotate(-0.4deg);
      }

      .sprite {
        position: absolute;
        width: var(--w);
        left: var(--x);
        top: var(--y);
        transform: translate(-50%, -50%) scale(var(--s, 1));
        transform-origin: center bottom;
      }

      .mirror-reflection {
        opacity: 0.55;
        filter: blur(0.4px) brightness(0.72);
      }

      .flipped {
        transform: translate(-50%, -50%) scaleX(-1) scale(var(--s, 1));
      }

      .flame::after {
        position: absolute;
        left: 50%;
        top: -6%;
        width: 16%;
        aspect-ratio: 1 / 1.7;
        content: "";
        border-radius: 50% 50% 42% 42%;
        background: radial-gradient(circle at 50% 62%, #fff2a8 0 20%, #f3a438 42%, rgba(180, 47, 30, 0.78) 70%, transparent 72%);
        box-shadow: 0 0 18px rgba(238, 165, 68, 0.75);
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Assets Review</h1>

      <h2>Generated Assets</h2>
      <section class="asset-grid">
        <div class="asset"><img src="public/assets/bg-dining.png" alt="background" /><strong>bg-dining.png</strong><span>1536x1024 background</span></div>
        <div class="asset"><img src="public/assets/chair.png" alt="chair" /><strong>chair.png</strong><span>transparent sprite</span></div>
        <div class="asset"><img src="public/assets/clock-face.png" alt="clock" /><strong>clock-face.png</strong><span>transparent sprite</span></div>
        <div class="asset"><img src="public/assets/coin.png" alt="coin" /><strong>coin.png</strong><span>transparent sprite</span></div>
        <div class="asset"><img src="public/assets/candelabra.png" alt="candlestick" /><strong>candelabra.png</strong><span>transparent sprite</span></div>
        <div class="asset"><img src="public/assets/plate.png" alt="plate" /><strong>plate.png</strong><span>transparent sprite</span></div>
        <div class="asset"><img src="public/assets/envelope.png" alt="envelope" /><strong>envelope.png</strong><span>transparent sprite</span></div>
      </section>

      <h2>Game Ratio Preview</h2>
      <section class="stage">
        <img class="sprite" src="public/assets/clock-face.png" alt="" style="--x: 50%; --y: 17%; --w: 7%; --s: 1" />
        <img class="sprite" src="public/assets/chair.png" alt="" style="--x: 27%; --y: 58%; --w: 10%; --s: 1" />
        <img class="sprite" src="public/assets/chair.png" alt="" style="--x: 42%; --y: 72%; --w: 10%; --s: 1" />
        <img class="sprite flipped" src="public/assets/chair.png" alt="" style="--x: 58%; --y: 72%; --w: 10%; --s: 1" />
        <img class="sprite flipped" src="public/assets/chair.png" alt="" style="--x: 73%; --y: 58%; --w: 10%; --s: 1" />
        <img class="sprite" src="public/assets/candelabra.png" alt="" style="--x: 40%; --y: 48%; --w: 4%; --s: 1" />
        <img class="sprite flame" src="public/assets/candelabra.png" alt="" style="--x: 47%; --y: 48%; --w: 4%; --s: 1" />
        <img class="sprite flame" src="public/assets/candelabra.png" alt="" style="--x: 53%; --y: 48%; --w: 4%; --s: 1" />
        <img class="sprite" src="public/assets/candelabra.png" alt="" style="--x: 60%; --y: 48%; --w: 4%; --s: 1" />
        <img class="sprite" src="public/assets/plate.png" alt="" style="--x: 50%; --y: 53%; --w: 10%; --s: 1" />
        <img class="sprite" src="public/assets/coin.png" alt="" style="--x: 35%; --y: 77%; --w: 3.2%; --s: 1" />
      </section>

      <h2>Photo Layer Preview</h2>
      <section class="stage photo">
        <img class="sprite mirror-reflection" src="public/assets/chair.png" alt="" style="--x: 43%; --y: 32%; --w: 3.5%; --s: 1" />
        <img class="sprite mirror-reflection" src="public/assets/chair.png" alt="" style="--x: 48%; --y: 33%; --w: 3.5%; --s: 1" />
        <img class="sprite mirror-reflection flipped" src="public/assets/chair.png" alt="" style="--x: 53%; --y: 33%; --w: 3.5%; --s: 1" />
        <img class="sprite mirror-reflection flipped" src="public/assets/chair.png" alt="" style="--x: 58%; --y: 32%; --w: 3.5%; --s: 1" />
        <img class="sprite flipped" src="public/assets/chair.png" alt="" style="--x: 68%; --y: 58%; --w: 10%; --s: 1" />
      </section>
    </main>
  </body>
</html>
